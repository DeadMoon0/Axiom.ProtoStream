name: Unit Tests

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Axiom.ProtoStream.slnx

      - name: Build
        run: dotnet build Axiom.ProtoStream.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Axiom.ProtoStream.slnx --configuration Release --no-build --logger "trx"
